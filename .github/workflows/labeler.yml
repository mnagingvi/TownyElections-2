name: Labeler

on:
  pull_request_target:
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # pull_request_target is required so the label write works for PRs from
      # forks. This job never checks out or runs the PR's code, only the
      # action's own labeler logic, so it is safe here.
      - name: Apply path labels
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false
