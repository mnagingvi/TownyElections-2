name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Check the tag matches the pom version
        run: |
          pom_version="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag: $tag_version, pom: $pom_version"
          if [ "$pom_version" != "$tag_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match <version>${pom_version}</version> in pom.xml"
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: target/TownyElections-*.jar
          generate_release_notes: true
