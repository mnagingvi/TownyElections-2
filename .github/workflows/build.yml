name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: |
          set -o pipefail
          mvn -B clean package --file pom.xml 2>&1 | tee build.log

      - name: Surface build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E "^\[ERROR\]|error:|cannot find symbol|Tests run:.*Failures" build.log | tail -30 | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
          fi

      - name: Write the build report
        if: always()
        run: |
          python3 scripts/build_summary.py --out build-report.md
          cat build-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the build report on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: build-report
          path: build-report.md

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: TownyElections
          path: target/TownyElections-*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Publish rolling nightly release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            --title "Nightly" \
            --notes "Automated nightly build from commit ${{ github.sha }} (updated on every push to main)." \
            --prerelease \
            --target main \
            target/TownyElections-*.jar
