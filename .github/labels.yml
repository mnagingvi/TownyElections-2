# Labels managed by .github/workflows/labels.yml (EndBug/label-sync).
# Existing labels that are not listed here are left alone, so the GitHub
# default set (bug, enhancement, documentation, ...) keeps working.
#
# Colours are hex without the leading '#'. Keep descriptions short: they are
# what shows up in the label picker and in the issue list tooltip.

